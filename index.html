<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MOVIEPICK - 1,126편 영화 추천 사이트">
  <meta name="theme-color" content="#09090b">
  <title>MOVIEPICK — 오늘 뭐 볼까?</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="logo">MOVIE<span>PICK</span></div>
  <nav><a href="#movies">영화 목록</a><a href="#about">소개</a></nav>
</header>

<section class="hero">
  <div class="badge">🍿 취향에 맞는 영화를 한눈에</div>
  <h1>오늘은 <span>무슨 영화</span> 볼까?</h1>
  <p>장르와 검색어로 찾아보고, 마음에 드는 영화가 없다면 랜덤 추천으로 새로운 작품을 발견해보세요.</p>
  <div class="actions">
    <button class="primary" onclick="randomPick()">🎲 랜덤 영화 추천</button>
    <button class="secondary" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">영화 둘러보기</button>
  </div>
</section>

<main class="container" id="movies">
  <div class="toolbar">
    <div class="search"><input id="search" type="search" placeholder="영화 제목이나 장르 검색..." oninput="render()"></div>
    <select id="genre" onchange="render()">
      <option value="전체">전체 장르</option><option>액션</option><option>SF</option><option>드라마</option>
      <option>코미디</option><option>로맨스</option><option>스릴러</option><option>애니메이션</option>
    </select>
  </div>
  <div class="section-title"><h2>추천 영화</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="about">MOVIEPICK · 개인 영화 추천 페이지 · 무료로 자유롭게 수정해서 사용하세요.</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>


<script src="./movies.js"></script>
<script src="./script.js"></script>
</body>
</html>
